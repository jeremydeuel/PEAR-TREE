[package]
name = "peartree-combine"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "PEAR-TREE combine_insertions step (Rust port of src/combine_insertions*.py)"
build = "build.rs"

[lib]
name = "peartree_combine"
path = "src/lib.rs"

[[bin]]
name = "peartree-combine"
path = "src/main.rs"

[dependencies]
# work-stealing parallelism: per-file discovery/sidecar parsing, per-chunk evidence evaluation
rayon = "1.10"
flate2 = "1.0"
# fast non-cryptographic hasher. Output order must NEVER depend on hash iteration order
# (see SPEC.md "Ordering"): every map that is iterated for output is an insertion-ordered
# Vec/IndexMap-style structure, hash maps are only used for membership / lookup.
rustc-hash = "2"
# config: `--config <file>.json`, or `<file>.py` dumped to JSON by a python subprocess
serde_json = "1"
# mappy (minimap2 python binding) equivalent for the RTE library matcher (tprt.rs /
# library.rs). Bundles minimap2 2.30 (mappy on the reference venv is 2.31 -- see SPEC.md
# "Fidelity risks").
minimap2 = { version = "0.1.31", optional = true }
tikv-jemallocator = { version = "0.6", optional = true }

[build-dependencies]
# compiles the vendored edlib 1.2.7 C++ (vendor/edlib) -- the exact library python-edlib
# 1.3.9 wraps, so alignment paths/distances are bit-identical (no cmake needed).
cc = "1.0"

# jemalloc ON by default (same reasoning as peartree-discovery: many small frees).
# `mappy` ON by default: required by slippage_reject / far_pair_strict (TPRT config).
[features]
default = ["jemalloc", "mappy"]
jemalloc = ["dep:tikv-jemallocator"]
mappy = ["dep:minimap2"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
