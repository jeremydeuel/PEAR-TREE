[package]
name = "peartree-discovery"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "PEAR-TREE discovery step (Rust port)"

[[bin]]
name = "peartree-discovery"
path = "src/main.rs"

[dependencies]
# All noodles crates pinned to one coherent line (core 0.17, MSRV <= 1.87) so
# there is a SINGLE noodles-sam version — cram::Record and bam::Record then share
# the same sam::alignment::Record trait, which read.rs is generic over.
noodles-bam = "0.80"
noodles-sam = "0.76"
noodles-bgzf = "0.40"
noodles-core = "0.17"
# native CRAM reading (real production format is CRAM); needs a reference FASTA.
noodles-cram = "0.83"
noodles-fasta = "0.53"
flate2 = "1.0"
# fast non-cryptographic hasher for the membership maps (SPD-5c). Output order
# never depends on hash order (BAM coordinate order + union.sort()), so this is
# byte-identical.
rustc-hash = "2"
# Optional drop-in global allocator (enable with `--features jemalloc`) to cut the
# heap-fragmentation high-water mark from discovery's tiny per-read allocations.
tikv-jemallocator = { version = "0.6", optional = true }

[features]
jemalloc = ["dep:tikv-jemallocator"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
