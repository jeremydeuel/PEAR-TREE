[package]
name = "peartree-discovery"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "PEAR-TREE discovery step (Rust port)"

[[bin]]
name = "peartree-discovery"
path = "src/main.rs"

[dependencies]
noodles-bam = "0.79"
noodles-sam = "0.75"
# pinned to the version noodles-bam 0.79 already resolves transitively, so no
# version skew against bam::io::Reader (SPD-2 multithreaded BGZF decode).
noodles-bgzf = "0.39"
flate2 = "1.0"
# fast non-cryptographic hasher for the membership maps (SPD-5c). Output order
# never depends on hash order (BAM coordinate order + union.sort()), so this is
# byte-identical.
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
