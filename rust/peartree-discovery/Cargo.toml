[package]
name = "peartree-discovery"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "PEAR-TREE discovery step (Rust port)"

[[bin]]
name = "peartree-discovery"
path = "src/main.rs"

[dependencies]
noodles-bam = "0.79"
noodles-sam = "0.75"
flate2 = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
